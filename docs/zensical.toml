copyright= "Copyright &copy; 2021 - 2026 FOSS United Foundation"
# site_url= "https://docs.fossunited.org"
repo_url= "https://github.com/fossunited/fossunited"
edit_uri= "edit/develop/docs/docs/"
docs_dir = "docs"
# extra_css = ["assets/custom.css"]

nav = [
  {"Home" = "index.md"},

  {"Your Profile" = [
    {"Create Your Profile" = "create-profile.md"},
    {"Manage Your Profile" = "manage-profile.md"},
    {"Request Personal Data" = "request-data.md"},
    {"Delete Personal Data" = "delete-data.md"}
  ]},

  {"Events & Participation" = [
