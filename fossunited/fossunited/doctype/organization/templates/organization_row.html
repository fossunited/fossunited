<div class="doctype-list-item">
	<a href="{{ doc.route }}" class="doctype-link">
		<span class="logo-title-wrap">
			{% if doc.logo %}
				<img src="{{ doc.logo }}" alt="Logo" class="doctype-logo">
			{% else %}
				  <!-- Default organization svg if not present -->
		  <svg class="doctype-logo" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
			<path d="M3 21v-2h18v2H3zm2-3V5a1 1 0 011-1h4V2h4v2h4a1 1 0 011 1v13H5zm6-5h2v-2h-2v2zm0 4h2v-2h-2v2zm-4-4h2v-2H7v2zm0 4h2v-2H7v2zm8-4h2v-2h-2v2zm0 4h2v-2h-2v2z"/>
		  </svg>
			{% endif %}
			<span class="doctype-title">{{ doc.title or doc.name }}</span>
		</span>
	</a>
</div>

<style>
	.doctype-list-item {
		padding: 15px 12px;
		border-bottom: 1px solid #eaeaea;
	}

	.doctype-link {
		text-decoration: none;
		color: inherit;
		display: inline-block;
		width: 100%;
	}

	.logo-title-wrap {
		display: inline-flex;
		align-items: center;
		gap: 8px;
	}

	.doctype-logo {
		width: 40px;
		height: 40px;
		object-fit: cover;
		border-radius: 4px;
		flex-shrink: 0;
	}

	.doctype-title {
		font-size: 2rem;
		color: #333;
	}
</style>
