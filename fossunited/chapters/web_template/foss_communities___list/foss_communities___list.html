
<div class="community-list-section container">
  <div class="community-list-container">
    <h2>FOSS Communities near you</h2>

    <div class="city-card-section">
      <div class="city-card-container">
        {%
          set communities = frappe.get_all("FOSS Chapter", fields=["city",
          "represent_image","route"], filters={"is_published": 1, "chapter_type": "City Community"},
          order_by="city")
        %}
        {% for community in communities %}
          <a class="city-card" href="{{ community.route }}" aria-label="Open source software communities in {{ community.city }}">
            <div class="city-image">
              <img src="{{ community.represent_image }}" alt="Open source software communities in {{ community.city }}" />
            </div>
            <span class="city-name">{{ community.city }}</span>
          </a>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<style>
  .community-list-section {
    display: flex;
    font-family: Inter;
  }

  .community-list-container {
    display: flex;
    gap: 3rem;
    width: 100%;
    flex-direction: column;
    padding: 6rem 0rem 6rem 0rem;
  }

  .city-card-section {
    display: flex;
    justify-content: space-between;
  }

  h2 {
    margin: 0;
    color: var(--Foundation-Code-Night-code-night-500, #1a1a1a);
    font-size: 1.75rem;
    font-weight: 600;
    line-height: 100%;
    letter-spacing: -0.105rem;
  }

  .city-card-container {
    display: grid;
    gap: 2rem;
    align-items: start;
    justify-content: center;
    grid-template-rows: 1fr 1fr 1fr;
    grid-template-columns: 1fr 1fr 1fr;
    width: 100%;
  }

  .city-card {
    display: flex;
    flex-direction: column;
    border-radius: 0.5rem;
    background: #f5f5f5;
    text-decoration: none;
    padding: 1rem;
    align-items: center;
  }

  .city-card:hover {
    color: #08b74f;
  }

  .city-name {
    padding: 1.5rem;
    color: var(--Foundation-Code-Night-code-night-500, #1a1a1a);
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: -0.045rem;
    text-decoration: none;
  }

  .city-card img {
    width: 100%;
    border-radius: 0.5rem;
  }

  @media screen and (max-width: 768px) {
    .community-list-section {
      flex-direction: column;
      gap: 2.5rem;
      padding: 1rem;
    }

    .community-list-container {
      padding: 4rem 0rem 4rem 0rem;
      gap: 3rem;
    }

    h2 {
      font-size: 1.5rem;
    }

    .city-card-container {
      display: grid;
      gap: 2rem;
      align-items: start;
      grid-template-columns: 1fr;
      width: 100%;
    }

    .city-card {
      display: flex;
      flex-direction: row-reverse;
      border-radius: 0.5rem;
      background: #f5f5f5;
      justify-content: flex-end;
      align-items: center;
      padding: 1rem;
      gap: 1rem;
    }

    .city-name {
      padding: 0;
    }

    .city-image {
      max-width: 2rem;
      max-height: 2rem;
      background-color: #1a1a1a;
    }

    .city-card img {
      height: 2rem;
    }
  }
</style>
