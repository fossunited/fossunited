{% macro meta_tags(page_title, description, image_url) %}
{%- set description = description or "FOSS United is a non-profit foundation that aims at promoting &amp; strengthening the Free and Open Source Software (FOSS) ecosystem in India." -%}
<meta property="og:site_name" content="FOSS United" />
<meta property="og:type" content="object" />
<meta name="twitter:site" content="@fossunited" />
<meta name="twitter:card" content="summary_large_image" />

<meta name="title" content="{{ page_title }}" />
<meta property="og:title" content="{{ page_title }}" />
<meta name="twitter:title" content="{{ page_title }}" />

<meta property="og:description" content="{{ description }}" />
<meta name="twitter:description" content="{{ description }}" />
<meta property="og:image:alt" content="{{ description }}" />

<meta property="og:image" content="{{ image_url }}" />
<meta name="twitter:image" content="{{ image_url }}" />

<meta property=”og:image:width” content=”1200” />
<meta property=”og:image:height” content=”630” />
{% endmacro %}
