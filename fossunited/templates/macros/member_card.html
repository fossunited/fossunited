{% macro member_card(member) %}
  <a class="member-card" href="/{{ member.route }}" aria-label="{{ member.full_name }}, {{ member.role }}">
    <img src="{{ member.profile_picture }}" alt="{{ member.full_name }}" class="member-card--image" />
    <div class="member-card--contents">
      <div class="member-card--name">{{ member.full_name }}</div>
      <div class="member-card--role">{{ member.role }}</div>
    </div>
  </a>
{% endmacro %}
