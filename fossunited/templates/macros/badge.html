{% macro badge(label='', theme='gray', size='md', variant='subtle', prefix='', suffix='', additional_classes='') %}
  <div class="v3-badge v3-badge-{{ size }} v3-badge--{{ variant }}-{{ theme }} {{ additional_classes }}">
    {% if prefix %}<span>{{ prefix }}</span>{% endif %}
    {{ label | e }}
    {% if suffix %}<span>{{ suffix }}</span>{% endif %}
  </div>
{% endmacro %}
