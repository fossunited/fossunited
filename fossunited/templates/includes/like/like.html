<div id="likes" class="feedback-item d-flex flex-row align-items-center likes">
  <button type="button" class="like-icon border-0" aria-pressed="false" aria-label="Like"></button>
  <span class="like-count"></span>
</div>

<script type="text/javascript">
  frappe.ready(() => {
    let like = parseInt('{{ like or 0 }}')
    let like_count = parseInt('{{ like_count or 0 }}')
    let in_queue = false

    let toggle_like_icon = function (active) {
      active ? $('.like-icon').addClass('liked') : $('.like-icon').removeClass('liked')
    }

    $('.like-icon').append(`<svg class="icon icon-sm" aria-hidden="true" focusable="false"><use href="#icon-heart"></use></svg>`)
    toggle_like_icon(like)

    $('.like-count').text(like_count)

    $('.like-icon').click(() => {
      if (in_queue) return
      update_like()
    })

    let update_like = function () {
      in_queue = true

      // Calculate intended state
      const intended_like = !like
      const intended_count = intended_like ? like_count + 1 : like_count - 1

      // Update UI optimistically
      toggle_like_icon(intended_like)
      $('.like-count').text(intended_count)

      return frappe
        .call({
          method: 'fossunited.templates.includes.like.like.like',
          args: {
            reference_doctype: '{{ reference_doctype or doctype }}',
            reference_name: '{{ reference_name or name }}',
            like: intended_like,
            route: '{{ pathname }}',
          },
        })
        .then((r) => {
          // Update actual state only after server confirms
          like = intended_like
          like_count = intended_count
          in_queue = false
        })
        .catch((err) => {
          // Revert UI on error
          toggle_like_icon(like)
          $('.like-count').text(like_count)
          in_queue = false
        })
    }
  })
</script>
