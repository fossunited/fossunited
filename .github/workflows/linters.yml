name: Linters

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: read

jobs:
  precommit-linters:
    name: prek Linters + frappe semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # prek compares against the base commit to find changed files.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The oxfmt/oxlint/eslint/prettier hooks run from node_modules.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            dashboard/yarn.lock

      - name: Install JS tooling
        # postinstall also installs dashboard/: oxfmt's Tailwind class sorting loads
        # dashboard/tailwind.config.js, which imports frappe-ui.
        run: yarn install --frozen-lockfile

      # prek reads the same .pre-commit-config.yaml as pre-commit.
      # Only changed files are checked, so untouched files get formatted when next
      # edited instead of in one repo-wide commit.
      - name: Run prek on files changed in the PR
        if: github.event_name == 'pull_request'
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --from-ref origin/${{ github.base_ref }} --to-ref HEAD

      - name: Run prek on files changed in the push
        if: github.event_name == 'push'
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --from-ref ${{ github.event.before }} --to-ref ${{ github.sha }}

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        # TODO: remove exclude once the 25 doctypes with "All" role perms are triaged (see relaxed-permissions rule)
        run: semgrep ci --config ./development/frappe-semgrep-rules/rules --exclude-rule development.frappe-semgrep-rules.rules.security.relaxed-permissions
