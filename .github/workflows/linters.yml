name: Linters

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: read

jobs:
  precommit-linters:
    name: pre-commit Linters + frappe semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JS dependencies (for eslint pre-commit hook)
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        # TODO: remove exclude once the 25 doctypes with "All" role perms are triaged (see relaxed-permissions rule)
        run: semgrep ci --config ./development/frappe-semgrep-rules/rules --exclude-rule development.frappe-semgrep-rules.rules.security.relaxed-permissions
