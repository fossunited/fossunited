name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest

    env:
      MARIADB_ROOT_PASSWORD: 'root'
      ADMIN_PASSWORD: 'admin'
      SITE_NAME: 'development.localhost'
      BENCH_PATH: '/home/runner/frappe-bench'

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5

      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5

      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MARIADB_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python with Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-setuptools python3-pip python3-venv

      - name: Upgrade pip and install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==69.5.1 wheel virtualenv

      - name: Install MariaDB Client
        run: |
          sudo apt-get install -y mariadb-client

      - name: Setup Bench Environment
        shell: bash
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ${{ env.BENCH_PATH }}

          mariadb --host 127.0.0.1 --port 3306 -u root -p${{ env.MARIADB_ROOT_PASSWORD }} -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -p${{ env.MARIADB_ROOT_PASSWORD }} -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install App and Setup Site
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench get-app fossunited $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin ${{ env.SITE_NAME }}
          bench --site ${{ env.SITE_NAME }} install-app fossunited
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          source ./env/bin/activate
          bench --site ${{ env.SITE_NAME }} set-config developer_mode 1
          bench --site ${{ env.SITE_NAME }} set-config allow_tests true
          bench --site ${{ env.SITE_NAME }} run-parallel-tests --app fossunited
