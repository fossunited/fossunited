exclude: 'node_modules|.git'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Needed because of the unsafe mermaid extension support in the mkdocs
        # yaml configuration file
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: ["--fix", "--config=pyproject.toml"]
      - id: ruff-format
        args: ["--config=pyproject.toml"]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (incl. vue a11y rules)
        entry: yarn eslint --fix
        language: system
        files: \.(js|mjs|cjs|vue)$
        exclude: ^(node_modules|dashboard/node_modules|fossunited/public/dist|fossunited/public/dashboard)/

  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-jinja
        files: \.html$
        args: ["--profile", "jinja"]

  # grammar checker for /docs content
  # - repo: https://github.com/errata-ai/vale
  #   rev: v3.13.0
  #   hooks:
  #     # - id: vale
  #     #   name: vale sync
  #     #   pass_filenames: false
  #     #   args: [sync]
  #     - id: vale
  #       pass_filenames: true
  #       args: [--output=line, --minAlertLevel=error]

  - repo: local
    hooks:
      - id: bruno-tests
        name: Bruno API e2e tests
        entry: bash development/run_bruno_tests.sh
        language: system
        pass_filenames: true
        files: '(^fossunited/api/.*\.py$|^bruno-collection/.*\.(bru|yml)$)'
        stages: [pre-commit]

  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.173.0'
    hooks:
      - id: semgrep
        stages: [pre-commit]
        exclude: '^development/'
        entry: semgrep
        # or see https://semgrep.dev/explore to select a ruleset and copy its URL
        # TODO: remove exclude once the 25 doctypes with "All" role perms are triaged (see relaxed-permissions rule)
        args: ['--config', 'development/frappe-semgrep-rules/rules', '--error', '--skip-unknown-extensions', '--exclude-rule', 'development.frappe-semgrep-rules.rules.security.relaxed-permissions']
        additional_dependencies: ['attrs']
