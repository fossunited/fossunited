exclude: "node_modules|.git"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Needed because of the unsafe mermaid extension support in the mkdocs
        # yaml configuration file
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: ["--fix", "--config=pyproject.toml"]
      - id: ruff-format
        args: ["--config=pyproject.toml"]

  # JS tooling runs from node_modules (`yarn install`), pinned once in package.json.
  # Formatters first, then linters. See .oxfmtrc.json / .oxlintrc.json.
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern
        language: system
        types_or: [javascript, vue, css, scss, json, yaml, markdown]
      - id: prettier-jinja
        # Oxfmt can't run Prettier plugins, so Jinja templates stay on Prettier.
        name: prettier (Jinja html)
        entry: node_modules/.bin/prettier --write
        language: system
        types: [html]
      - id: oxlint
        name: oxlint
        entry: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern
        language: system
        types_or: [javascript, vue]
      - id: eslint-vue
        # Oxlint can't parse Vue templates; ESLint runs eslint-plugin-vue only.
        name: eslint (Vue templates)
        entry: node_modules/.bin/eslint --fix --no-warn-ignored
        language: system
        files: \.vue$

  # grammar checker for /docs content
  # - repo: https://github.com/errata-ai/vale
  #   rev: v3.13.0
  #   hooks:
  #     # - id: vale
  #     #   name: vale sync
  #     #   pass_filenames: false
  #     #   args: [sync]
  #     - id: vale
  #       pass_filenames: true
  #       args: [--output=line, --minAlertLevel=error]

  - repo: local
    hooks:
      - id: bruno-tests
        name: Bruno API e2e tests
        entry: bash development/run_bruno_tests.sh
        language: system
        pass_filenames: true
        files: '(^fossunited/api/.*\.py$|^bruno-collection/.*\.yml$)'
        stages: [pre-commit]

  - repo: https://github.com/semgrep/pre-commit
    rev: "v1.173.0"
    hooks:
      - id: semgrep
        stages: [pre-commit]
        exclude: "^development/"
        entry: semgrep
        # or see https://semgrep.dev/explore to select a ruleset and copy its URL
        # TODO: remove exclude once the 25 doctypes with "All" role perms are triaged (see relaxed-permissions rule)
        args:
          [
            "--config",
            "development/frappe-semgrep-rules/rules",
            "--error",
            "--skip-unknown-extensions",
            "--exclude-rule",
            "development.frappe-semgrep-rules.rules.security.relaxed-permissions",
          ]
        additional_dependencies: ["attrs"]
