info:
  name: set-profile-image-path-traversal
  type: http
  seq: 2
http:
  method: POST
  url: '{{base}}/method/fossunited.api.profile.set_profile_image'
  body:
    type: json
    data: |-
      {
        "file_url": "../../common_site_config.json"
      }
runtime:
  scripts:
    - type: tests
      code: |
        test("path traversal should be rejected with 403 or 417", function() {
          expect(res.getStatus()).to.be.oneOf([403, 417]);
        });

        test("error message indicates invalid path", function() {
          const body = JSON.stringify(res.getBody()).toLowerCase();
          expect(body).to.include("invalid file path");
        });
docs: |-
  set_profile_image path traversal: payload escapes public dir via ../..
  Fix uses os.path.realpath() to resolve and verify path stays under site/public/.
