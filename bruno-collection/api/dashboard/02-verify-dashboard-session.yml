info:
  name: verify-dashboard-session
  type: http
  seq: 3
http:
  method: GET
  url: '{{base}}/method/frappe.auth.get_logged_user'
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |
        test("dashboard requests use the intended authenticated attendee", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().message).to.equal(bru.getEnvVar("attendee_email"));
          expect(res.getBody().message).to.not.equal("Guest");
        });
docs: |-
  Verifies the existing login request's HTTP cookie jar before the chapter
  dashboard request, without depending on legacy folder script parsing.
