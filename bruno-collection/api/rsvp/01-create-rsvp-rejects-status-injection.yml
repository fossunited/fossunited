info:
  name: create-rsvp-rejects-status-injection
  type: http
  seq: 1
http:
  method: POST
  url: '{{base}}/method/fossunited.chapters.doctype.foss_event_rsvp.foss_event_rsvp.create_rsvp'
  body:
    type: json
    data: |-
      {
        "fields": "{\"linked_rsvp\": \"{{rsvp_form_id}}\", \"name1\": \"Security Test\", \"email\": \"sectest-rsvp-inject@example.com\", \"im_a\": \"Student\", \"status\": \"Accepted\", \"docstatus\": 1, \"owner\": \"hacker@evil.com\"}"
      }
runtime:
  auth:
    type: none
tests:
  value: |
    test("should create RSVP but injected fields must be ignored", function() {
      const data = res.getBody();
      if (res.getStatus() === 200) {
        const doc = data.message;
        expect(doc.owner).to.not.equal("hacker@evil.com");
        expect(doc.docstatus).to.not.equal(1);
      }
    });
docs: |-
  create_rsvp mass assignment test: payload includes blocked fields (status, docstatus, owner).
  RSVP_ALLOWED_FIELDS allowlist must filter these out.
