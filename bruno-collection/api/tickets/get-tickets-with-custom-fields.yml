      // Should NOT leak email, owner, modified_by, etc.
      data.forEach(function(ticket) {
        expect(ticket).to.not.have.property("email");
        expect(ticket).to.not.have.property("owner");
        expect(ticket).to.not.have.property("modified_by");
        expect(ticket).to.not.have.property("razorpay_payment");
      });
    });
