info:
  name: download-ticket
  type: http
  seq: 15
http:
  method: POST
  url: '{{base}}/method/fossunited.api.tickets.download_ticket'
  body:
    type: form-urlencoded
    data:
    - name: ticket_id
      value: '{{ticket_id}}'
runtime:
  auth:
    type: apikey
    key: Authorization
    value: '{{auth_token}}'
    placement: header
tests:
  value: |
    test("returns PDF or error for invalid ticket", function() {
      const status = res.getStatus();
      // Valid ticket: returns PDF (200 with binary content)
      // Invalid ticket: returns error
      expect([200, 417]).to.include(status);
    });
docs: |-
  SECURITY NOTE: Guest-accessible. Ticket IDs are random hashes (not sequential),
  so enumeration is impractical. Ticket ID functions as a bearer token for download.
  Uses ignore_print_permissions=True to bypass Frappe print perms.

  allow_guest: true | Rate: 5/5h

  Source: fossunited/api/tickets.py

  Args: ticket_id: str
